<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartFarmDemo — 벅스팜 3D 데모</title>
<style>
  :root{--bg:#0b1020;--panel:rgba(16,22,42,.86);--line:#2d3a63;--txt:#e8eef7;--dim:#8fa3c0;--acc:#8a5cff;--ok:#46d19a;--warn:#ffb454}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Pretendard,'Malgun Gothic','Segoe UI',sans-serif;overflow:hidden}
  #app{position:fixed;inset:0}
  .panel{position:fixed;z-index:10;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;backdrop-filter:blur(6px)}
  .panel h2{margin:0 0 10px;font-size:13px;color:#cdbcff;letter-spacing:.03em;display:flex;justify-content:space-between;align-items:center}
  .panel h2 small{color:var(--dim);font-weight:500;font-size:11px}
  #pZone{top:14px;left:14px;width:236px}
  #zones{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  #zones button{height:34px;border:1px solid var(--line);border-radius:8px;background:#141b36;color:var(--dim);font-size:13px;font-weight:700;cursor:pointer}
  #zones button.on{border-color:var(--acc);color:#fff;background:#2a2060;box-shadow:0 0 0 1px var(--acc) inset}
  #pEnv{top:196px;left:14px;width:236px}
  .env{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;margin-bottom:6px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#0f1530}
  .env:last-child{margin-bottom:0}
  .env span{color:var(--dim)}.env b{font-variant-numeric:tabular-nums}
  .env em{font-style:normal;font-size:11px;color:#6d7ba0;margin-left:8px}
  #pStat{right:14px;top:14px;width:300px}
  #chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:#0f1530;color:#6d7ba0}
  .chip.on{border-color:var(--ok);color:#9dffd3;background:#10352a}
  #pStep{left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:10px 16px}
  .step{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--dim);min-width:64px}
  .step i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:12px}
  .bar{width:30px;height:2px;background:var(--line);margin-bottom:18px}
  #visBtn{margin-left:14px;height:34px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:#141b36;color:var(--txt);font-size:12px;font-weight:700;cursor:pointer}
  #visBtn.on{border-color:var(--ok);color:#9dffd3}
  #hint{position:fixed;top:14px;left:50%;transform:translateX(-50%);font-size:11px;color:#5d7191;z-index:10;white-space:nowrap}
  #back{position:fixed;right:14px;bottom:14px;z-index:10;color:#cdbcff;font-size:13px}
  .lbl{position:fixed;left:0;top:0;z-index:5;pointer-events:none;will-change:transform}
  .lbl i{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:#b79cff;box-shadow:0 0 0 3px rgba(138,92,255,.28)}
  .lbl div{position:absolute;left:12px;top:-28px;white-space:nowrap;font-size:12px;line-height:1.3;padding:4px 9px;border-radius:8px;background:rgba(16,22,42,.9);border:1px solid var(--line)}
  .lbl b{display:block;color:#fff;font-size:12px}.lbl span{color:var(--dim);font-size:11px}
  @media (max-width:900px){#pStat,#hint{display:none}#pStep{display:none}#pEnv{top:190px}}
  @media (max-width:560px){#pZone,#pEnv{width:190px}#pEnv{display:none}.lbl span{display:none}}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>

<div class="panel" id="pZone">
  <h2>구역 <small id="zSel">선택 없음</small></h2>
  <div id="zones"></div>
</div>
<div class="panel" id="pEnv">
  <h2>환경 센서정보 <small id="envStatus">시뮬레이터 연결 중</small></h2>
  <div class="env"><span>온도</span><b><span id="temperature">--</span><em>°C</em></b></div>
  <div class="env"><span>습도</span><b><span id="humidity">--</span><em>%</em></b></div>
  <div class="env"><span>암모니아</span><b>--<em>ppm</em></b></div>
  <div class="env"><span>공기질</span><b>--<em>%</em></b></div>
  <div class="env"><span>현재수위</span><b>--</b></div>
</div>
<div class="panel" id="pStat">
  <h2>벅스팜 상태정보</h2>
  <div id="chips"></div>
</div>
<div class="panel" id="pStep"></div>
<div id="hint">드래그: 회전 · 휠: 확대/축소 · 랙 클릭: 구역 선택</div>
<a id="back" href="/twin/">온실 디지털트윈</a>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = id => document.getElementById(id);
async function pollEnvironment() {
  try {
    const response = await fetch('/api/status');
    if (!response.ok) throw new Error('Status request failed');
    const { latest } = await response.json();
    $('temperature').textContent = latest.temperatureC.toFixed(1);
    $('humidity').textContent = latest.humidityPercent.toFixed(0);
    $('envStatus').textContent = '시뮬레이션';
  } catch {
    $('temperature').textContent = '--';
    $('humidity').textContent = '--';
    $('envStatus').textContent = '연결 끊김';
  } finally {
    setTimeout(pollEnvironment, 2000);
  }
}

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1020);
scene.fog = new THREE.Fog(0x0b1020, 26, 60);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, .1, 120);
camera.position.set(12, 11, 17);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
$('app').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(1.5, 1.2, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * .49;
controls.minDistance = 8; controls.maxDistance = 38;

scene.add(new THREE.HemisphereLight(0xc9c0ff, 0x151a33, .75));
const sun = new THREE.DirectionalLight(0xffffff, .55);
sun.position.set(8, 14, 6); sun.castShadow = true;
sun.shadow.camera.left = -16; sun.shadow.camera.right = 16; sun.shadow.camera.top = 12; sun.shadow.camera.bottom = -12;
scene.add(sun);

const M = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .55, ...o });
const box = (w, h, d, mat, x, y, z, parent) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
};

const world = new THREE.Group();
world.position.set(-6.2, 0, 0);
scene.add(world);

// ── 바닥 (미니어처 베이스) ──
const base = new THREE.Mesh(new THREE.BoxGeometry(15.6, .25, 7.6), M(0xdfe4ee, { roughness: .35 }));
base.position.set(6.2, -.125, 0); base.receiveShadow = true; scene.add(base);
base.position.add(world.position);
const grid = new THREE.GridHelper(40, 40, 0x232d52, 0x192142); grid.position.y = -.26; scene.add(grid);

// ── 랙 ──
const BW = .95, BH = .42, BD = 1.3, PITCH = .52, TIERS = 4, COLS = 2, BAY = COLS * 1.0 + .12;
const frameMat = M(0xf1f3f8, { roughness: .4, metalness: .3 });
const shelfMat = M(0xcfd5e2, { roughness: .5 });
const boxMat = new THREE.MeshStandardMaterial({ color: 0x6d63e0, roughness: .35, transparent: true, opacity: .92 });
const lidMat = M(0x9a92f5, { roughness: .4 });
const bays = [];

function buildRow(zc, count, zoneStart) {
  for (let b = 0; b < count; b++) {
    const g = new THREE.Group();
    const x0 = b * BAY;
    g.position.set(x0, 0, zc);
    for (const [px, pz] of [[0, -BD / 2 - .05], [BAY - .06, -BD / 2 - .05], [0, BD / 2 + .05], [BAY - .06, BD / 2 + .05]])
      box(.05, TIERS * PITCH + .15, .05, frameMat, px + .03, (TIERS * PITCH + .15) / 2, pz, g);
    for (let t = 0; t <= TIERS; t++)
      box(BAY - .02, .03, BD + .14, shelfMat, BAY / 2 - .01, .05 + t * PITCH, 0, g);
    for (let c = 0; c < COLS; c++) for (let t = 0; t < TIERS; t++) {
      const y = .08 + t * PITCH + BH / 2;
      const px = .06 + BW / 2 + c * 1.0;
      box(BW, BH, BD, boxMat, px, y, 0, g);
      box(BW + .04, .05, BD + .04, lidMat, px, y + BH / 2, 0, g);
    }
    const hl = new THREE.Mesh(new THREE.BoxGeometry(BAY, TIERS * PITCH + .1, BD + .2),
      new THREE.MeshBasicMaterial({ color: 0x8a5cff, transparent: true, opacity: 0, depthWrite: false }));
    hl.position.set(BAY / 2, (TIERS * PITCH + .1) / 2, 0);
    hl.userData.zone = zoneStart + b;
    g.add(hl); bays.push(hl);
    world.add(g);
  }
}
buildRow(-2.0, 5, 1);   // 구역 1–5 (뒤쪽 열)
buildRow(2.0, 4, 6);    // 구역 6–9 (앞쪽 열)

// ── 아크릴 하우징 (미니어처 외벽) ──
const acrylic = new THREE.MeshPhysicalMaterial({ color: 0xaad0ff, transparent: true, opacity: .07, roughness: .05, side: THREE.DoubleSide, depthWrite: false });
const HW = 13.1, HD = 6.9, HH = 3.2;
for (const [w, h, d, x, y, z] of [[HW, HH, .02, HW / 2 - .3, HH / 2, -HD / 2], [HW, HH, .02, HW / 2 - .3, HH / 2, HD / 2], [.02, HH, HD, -.3, HH / 2, 0], [.02, HH, HD, HW - .3, HH / 2, 0]]) {
  const p = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), acrylic); p.position.set(x, y, z); world.add(p);
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(p.geometry), new THREE.LineBasicMaterial({ color: 0x9fb4ff, transparent: true, opacity: .55 }));
  e.position.copy(p.position); world.add(e);
}

// ── 비전존 (뒤쪽 열 오른쪽 끝) ──
const VX = 5 * BAY + .5;
const vz = new THREE.Group(); vz.position.set(VX, 0, -2.0); world.add(vz);
for (const [px, pz] of [[-.4, -.9], [2.0, -.9], [-.4, .9], [2.0, .9]]) box(.06, 2.6, .06, frameMat, px, 1.3, pz, vz);
for (const y of [.05, 2.55]) box(2.5, .05, 1.9, frameMat, .8, y, 0, vz);
box(1.2, .06, 1.0, M(0xe9ecf4), .8, .62, 0, vz);                         // 촬영 스테이지
const stageBox = box(.9, .32, 1.2, boxMat, .8, .82, 0, vz);              // 촬영 대상 박스
box(.94, .05, 1.24, lidMat, .8, 1.0, 0, vz).visible = false;
const ringMat = new THREE.MeshStandardMaterial({ color: 0xfff6d8, emissive: 0xffe9a8, emissiveIntensity: 0 });
const ring = new THREE.Mesh(new THREE.TorusGeometry(.45, .05, 10, 28), ringMat);
ring.rotation.x = Math.PI / 2; ring.position.set(.8, 2.1, 0); vz.add(ring);        // 링 조명
const cam = box(.34, .26, .34, M(0x222831), .8, 2.4, 0, vz);                      // 카메라
const lens = new THREE.Mesh(new THREE.CylinderGeometry(.09, .12, .1, 14), M(0x0e1118, { metalness: .7, roughness: .2 }));
lens.position.set(.8, 2.2, 0); vz.add(lens);
const coneMat = new THREE.MeshBasicMaterial({ color: 0x9fb4ff, transparent: true, opacity: .05, side: THREE.DoubleSide, depthWrite: false });
const cone = new THREE.Mesh(new THREE.ConeGeometry(.65, 1.4, 24, 1, true), coneMat);
cone.position.set(.8, 1.45, 0); cone.rotation.x = Math.PI; vz.add(cone);
const vlight = new THREE.PointLight(0xffe9a8, 0, 5); vlight.position.set(.8, 1.9, 0); vz.add(vlight);

// ── 이송 로봇 스테이션 (앞쪽 열 오른쪽 끝) ──
const rb = new THREE.Group(); rb.position.set(4 * BAY + .6, 0, 2.0); world.add(rb);
box(2.6, .08, .12, shelfMat, .9, .12, -.55, rb); box(2.6, .08, .12, shelfMat, .9, .12, .55, rb);   // 레일
box(.5, .22, .9, M(0x39425a), .9, .26, 0, rb);
const arm = box(.14, 1.6, .14, frameMat, .9, 1.1, 0, rb);
box(.9, .12, .14, frameMat, .9, 1.85, 0, rb);

// ── 환경 센서 (뒤쪽 아크릴 벽) ──
for (const x of [2.4, 8.2]) {
  box(.34, .34, .08, M(0x2e8e86), x, 2.7, -HD / 2 + .1, world);
}

// ── 이름표 ──
const labels = [
  ['비전존', '카메라 · 링 조명', [VX + .8, 2.7, -2.0]],
  ['환경 센서', '온도·습도·NH₃', [2.4, 2.9, -HD / 2 + .1]],
  ['환경 센서', '공기질', [8.2, 2.9, -HD / 2 + .1]],
  ['이송 로봇', '박스 IN/OUT', [4 * BAY + 1.5, 2.1, 2.0]],
].map(([name, sub, p]) => {
  const el = document.createElement('div');
  el.className = 'lbl'; el.innerHTML = `<i></i><div><b>${name}</b><span>${sub}</span></div>`;
  document.body.appendChild(el);
  return { el, pos: new THREE.Vector3(...p).add(world.position) };
});
const tmp = new THREE.Vector3();
function placeLabels() {
  for (const l of labels) {
    tmp.copy(l.pos).project(camera);
    l.el.style.transform = `translate(${(tmp.x * .5 + .5) * innerWidth}px,${(-tmp.y * .5 + .5) * innerHeight}px)`;
    l.el.style.display = tmp.z > 1 ? 'none' : '';
  }
}

// ── HUD: 구역 / 상태 칩 / 공정 ──
for (let z = 1; z <= 9; z++) {
  const b = document.createElement('button'); b.textContent = z + '구역'; b.dataset.z = z;
  b.onclick = () => selectZone(z === selected ? 0 : z);
  $('zones').appendChild(b);
}
const chipNames = ['톱밥 공급', '분변 털기', '수분 보충', '로봇 이송', '젤리 공급', '세척', '비전 촬영', '박스 IN/OUT', '공기정화'];
$('chips').innerHTML = chipNames.map(n => `<span class="chip" data-n="${n}">${n}</span>`).join('');
const steps = ['톱밥 교체', '젤리 공급', '수분 공급', '배출 공정', '완료'];
$('pStep').innerHTML = steps.map((s, i) => `<div class="step"><i>${i + 1}</i>${s}</div>${i < steps.length - 1 ? '<div class="bar"></div>' : ''}`).join('')
  + '<button id="visBtn">비전 촬영 미리보기</button>';

let selected = 0;
function selectZone(z) {
  selected = z;
  bays.forEach(h => h.material.opacity = h.userData.zone === z ? .3 : 0);
  document.querySelectorAll('#zones button').forEach(b => b.classList.toggle('on', +b.dataset.z === z));
  $('zSel').textContent = z ? z + '구역' : '선택 없음';
}
let vis = false;
function setVision(on) {
  vis = on;
  ringMat.emissiveIntensity = on ? 2.6 : 0;
  vlight.intensity = on ? 2.5 : 0;
  coneMat.opacity = on ? .16 : .05;
  document.querySelector('.chip[data-n="비전 촬영"]').classList.toggle('on', on);
  $('visBtn').classList.toggle('on', on);
}
$('visBtn').onclick = () => setVision(!vis);
pollEnvironment();

// 클릭으로 구역 선택 (드래그와 구분)
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let down = null;
renderer.domElement.addEventListener('pointerdown', e => down = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(bays, false)[0];
  selectZone(hit ? (hit.object.userData.zone === selected ? 0 : hit.object.userData.zone) : 0);
});

(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
  placeLabels();
})();
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
