<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AgentCrew Voice</title>
<style>
  :root{--bg:#0e1420;--panel:#16202f;--line:#26334a;--txt:#e8eef7;--dim:#8fa3c0;--acc:#4f8cff;--ok:#46d19a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Pretendard,'Segoe UI',sans-serif;overscroll-behavior:none}
  #wrap{display:flex;flex-direction:column;height:100dvh;max-width:640px;margin:0 auto}
  header{padding:18px 20px 10px;display:flex;align-items:center;gap:12px}
  header h1{font-size:17px;margin:0;font-weight:700}
  #status{margin-left:auto;font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:#3a2530;color:#ff8fa3}
  #status.live{background:#123a28;color:var(--ok)}
  #log{flex:1;overflow-y:auto;padding:8px 20px 12px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:82%;padding:10px 14px;border-radius:14px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:keep-all}
  .msg.user{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:4px}
  .msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg.sys{align-self:center;background:transparent;color:var(--dim);font-size:12px;padding:2px}
  footer{padding:14px 20px calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center}
  #talk{flex:1;height:56px;border:0;border-radius:16px;font-size:16px;font-weight:700;background:var(--acc);color:#fff;cursor:pointer}
  #talk.on{background:#b3452e}
  #mute{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:20px;cursor:pointer}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>AgentCrew</h1>
    <span id="status">대기</span>
  </header>
  <div id="log"></div>
  <footer>
    <button id="talk">음성 대화 시작</button>
    <button id="mute" title="mute">🎙</button>
  </footer>
</div>
<script>
const $ = id => document.getElementById(id);
const log = $('log'), statusEl = $('status'), talkBtn = $('talk'), muteBtn = $('mute');
let pc = null, dc = null, stream = null, live = false, muted = false;

function addMsg(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}
const setStatus = (t, live) => { statusEl.textContent = t; statusEl.className = live ? 'live' : ''; };

async function start() {
  setStatus('연결 중…'); talkBtn.disabled = true;
  try {
    const { clientSecret } = await (await fetch('/api/voice-token', { method: 'POST' })).json();
    if (!clientSecret) throw new Error('token missing');

    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    pc = new RTCPeerConnection();
    dc = pc.createDataChannel('oai-events');
    dc.addEventListener('message', onEvent);
    pc.addEventListener('track', e => {
      const a = new Audio(); a.srcObject = e.streams[0]; a.play();
    });
    stream.getTracks().forEach(t => pc.addTrack(t, stream));

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    const sdpRes = await fetch('https://api.openai.com/v1/realtime/calls', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + clientSecret, 'Content-Type': 'application/sdp' },
      body: offer.sdp,
    });
    if (!sdpRes.ok) throw new Error('SDP ' + sdpRes.status + ' ' + await sdpRes.text());
    await pc.setRemoteDescription({ type: 'answer', sdp: await sdpRes.text() });

    live = true;
    setStatus('LIVE', true);
    talkBtn.textContent = '음성 대화 종료'; talkBtn.classList.add('on'); talkBtn.disabled = false;
    addMsg('연결되었습니다. 무엇이든 물어보세요.', 'sys');
  } catch (e) {
    setStatus('오류'); talkBtn.disabled = false;
    addMsg('연결 실패: ' + e.message, 'sys');
  }
}

function stop() {
  live = false;
  try { dc?.close(); pc?.close(); stream?.getTracks().forEach(t => t.stop()); } catch {}
  pc = dc = stream = null;
  setStatus('대기'); talkBtn.textContent = '음성 대화 시작'; talkBtn.classList.remove('on');
  addMsg('연결이 종료되었습니다.', 'sys');
}

function onEvent(ev) {
  let j; try { j = JSON.parse(ev.data); } catch { return; }
  const t = j.type || '';
  if (t === 'conversation.item.input_audio_transcription.completed' && j.transcript)
    addMsg(j.transcript, 'user');
  else if (t === 'response.audio_transcript.done' && j.transcript)
    addMsg(j.transcript, 'bot');
  else if (t === 'error')
    addMsg('API 오류: ' + JSON.stringify(j.error?.message || j), 'sys');
}

talkBtn.onclick = () => live ? stop() : start();
muteBtn.onclick = () => {
  muted = !muted;
  stream?.getAudioTracks().forEach(t => t.enabled = !muted);
  muteBtn.textContent = muted ? '🔇' : '🎙';
  muteBtn.style.opacity = muted ? .4 : 1;
};
</script>
</body>
</html>
